{# Lakzegel met een takje hulst en den eronder. Kleuren uit de kleurvariant (--wl-seal*); zonder persoonlijk zegel (Compleet) een standaardmotief in rood of groen. #}

    <radialGradient id="wl-wax" cx="38%" cy="32%" r="72%">
      <stop offset="0" style="stop-color:var(--wl-seal-2)"/>

    <radialGradient id="wl-wax-dark" cx="50%" cy="50%" r="50%">

      <stop offset="1" stop-color="#000" stop-opacity=".32"/>

    <linearGradient id="wl-press" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
