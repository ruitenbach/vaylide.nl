{# Drie hangende kerstballen boven de namen. Getekend met CSS-lagen (geen verlopen met id's), zodat ze overal werken. #}
<div class="mn-hangers" aria-hidden="true">
  <span class="mn-hang mn-hang--1"><span class="mn-hang__cap"></span><span class="mn-hang__ball"></span></span>
  <span class="mn-hang mn-hang--2"><span class="mn-hang__cap"></span><span class="mn-hang__ball"><span class="mn-hang__mono">{{ v.monogram }}</span></span></span>
  <span class="mn-hang mn-hang--3"><span class="mn-hang__cap"></span><span class="mn-hang__ball"></span></span>
</div>
