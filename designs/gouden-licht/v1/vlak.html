{# Eén klep van de envelop: de bloemen als schaduw, reliëf, wisselende glans en gouden gloed, en de rand van de klep. #}
<svg class="gl-fl gl-fl--shadow" viewBox="0 0 500 800" preserveAspectRatio="none" aria-hidden="true" focusable="false"><use href="#gl-bloemen" width="500" height="800"/></svg>
<svg class="gl-fl gl-fl--relief" viewBox="0 0 500 800" preserveAspectRatio="none" aria-hidden="true" focusable="false"><use href="#gl-bloemen" width="500" height="800"/></svg>
<svg class="gl-fl gl-fl--shine" viewBox="0 0 500 800" preserveAspectRatio="none" aria-hidden="true" focusable="false"><use href="#gl-bloemen" width="500" height="800"/></svg>
<svg class="gl-fl gl-fl--gold" viewBox="0 0 500 800" preserveAspectRatio="none" aria-hidden="true" focusable="false"><use href="#gl-bloemen" width="500" height="800"/></svg>
<svg class="gl-edge" viewBox="0 0 500 800" preserveAspectRatio="none" aria-hidden="true" focusable="false"><polygon points="{{ pts }}"/></svg>
