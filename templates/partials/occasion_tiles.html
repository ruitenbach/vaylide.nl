{% load static vl %}{# Themakaarten per gelegenheid: boogvormige kaarten met diepte die zacht zweven (Kerst voorop). Staande beelden uit tools/merkbeelden/voorbeelden.cjs. #}
<ul class="tile-grid">
  {% for key, label in tiles %}<li style="--i:{{ forloop.counter0 }}"><a class="tile tile--{{ key }}" href="{% url 'core:designs' %}?gelegenheid={{ key }}">
    <span class="tile__img"><img src="{% static 'img/site/tegel-'|add:key|add:'.webp' %}" alt="" width="400" height="500" loading="lazy" decoding="async"></span>
    <span class="tile__label">{{ label }} {% icon "pijl" %}</span>
  </a></li>{% endfor %}
</ul>
